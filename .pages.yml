media:
  - name: images
    label: Images
    input: assets/images
    output: /assets/images
    rename: safe
    categories: [image]

content:
  - name: posts
    label: Articles
    type: collection
    path: _posts
    format: yaml-frontmatter

    filename: "{year}-{month}-{day}-{title}.md"

    view:
      fields: [title, date, category]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc

    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: date
        label: Publish Date
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd HH:mm:ss"

      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - K-pop News
            - Old K-pop
            - K-pop History
            - K-OST
            - Curator's Choice
            - K-pop Culture
            - K-pedia Files

      - name: description
        label: Meta Description
        type: text
        
      - name: permalink
        label: Original URL / Permalink
        type: string
        required: false
        description: "Keep the original Blogger URL path when migrating an existing article."
        
      - name: image
        label: Featured Image
        type: image
        options:
          media: images

      - name: body
        label: Article
        type: rich-text
        required: true
        options:
          media: images
          rename: safe
          switcher: true
